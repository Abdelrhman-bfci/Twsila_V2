<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            font-family: 'Cairo', sans-serif;
        }

<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-surface text-on-surface min-h-screen flex flex-col items-center justify-center">
<div class="w-full max-w-[440px] px-container-margin py-stack-lg">
<!-- Logo and Branding Section -->
<div class="text-center mb-stack-lg">
<div class="inline-flex items-center justify-center p-4 rounded-xl bg-primary-container shadow-[0_8px_30px_rgb(55,48,163,0.12)] mb-stack-md">
<span class="material-symbols-outlined text-on-primary-container text-[40px]" data-icon="directions_bus">directions_bus</span>
</div>
<h1 class="font-h1 text-h1 text-primary tracking-tighter">TWSILA</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-2">Connecting Egypt's Academic Community</p>
</div>
<!-- Login Card -->
<div class="bg-surface-container-lowest p-8 rounded-xl shadow-[0_4px_20px_rgba(55,48,163,0.04)] border border-surface-variant/50">
<h2 class="font-h2 text-h2 mb-stack-md text-on-surface">Welcome Back</h2>
<form class="space-y-stack-md" onsubmit="return false;">
<!-- Email Field -->
<div class="space-y-1">
<label class="font-label-md text-label-md text-on-surface-variant block" for="email">University Email</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-[20px] group-focus-within:text-primary transition-colors" data-icon="school">school</span>
</div>
<input class="w-full pl-11 pr-4 py-3 bg-surface-container-low border border-outline-variant rounded-lg font-body-md focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all placeholder:text-outline" id="email" placeholder="student@uni.edu.eg" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-1">
<label class="font-label-md text-label-md text-on-surface-variant block" for="password">Password</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-[20px] group-focus-within:text-primary transition-colors" data-icon="lock">lock</span>
</div>
<input class="w-full pl-11 pr-4 py-3 bg-surface-container-low border border-outline-variant rounded-lg font-body-md focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all placeholder:text-outline" id="password" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Forgot Password -->
<div class="flex justify-end">
<a class="font-label-md text-label-md text-primary hover:text-primary-fixed-dim transition-colors" href="#">Forgot Password?</a>
</div>
<!-- Sign In Button -->
<button class="w-full bg-primary-container text-on-primary-container py-4 rounded-lg font-label-md text-lg shadow-[0_4px_12px_rgba(31,16,142,0.15)] hover:bg-primary transition-all active:scale-[0.98] mt-4" type="submit">
                    Sign In
                </button>
</form>
<!-- Social/Other Logins (Optional but adds to "Professional" feel) -->
<div class="relative my-stack-lg">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant"></div>
</div>
<div class="relative flex justify-center text-label-sm">
<span class="bg-surface-container-lowest px-4 text-on-surface-variant uppercase tracking-widest font-bold">Verified Partners</span>
</div>
</div>
<div class="grid grid-cols-2 gap-gutter">
<button class="flex items-center justify-center gap-2 py-2 border border-outline-variant rounded-lg font-label-md text-on-surface hover:bg-surface-container-high transition-colors">
<img alt="Google Logo" class="w-4 h-4" data-alt="Official Google favicon icon for SSO login interface" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBEqWTHdhnGQh-MyfZqwlenmcGY6fbNkmhyzPCeazd2MVUwiyZn2BAuhjT_hANIhoePbSyg_sWwnTKMviUxY2ceK1PpklzYYNvidDquJ-aYQSw9bmqoLcZLe4Bnu1x1nc06OAKGNsjtRoipEVXCKwJQDV1ZXYK0KI9PjFt-UhKtzVJVPCWlr3q2MBvxkehVKDMBg7AYdZJ8aEqzbgOI8xA0we-SWLddwpPFCpl1UCmP0BbKWQhrQMKkphR2HjSz0ai6_lXI4Jq-R2A"/>
                    Google
                </button>
<button class="flex items-center justify-center gap-2 py-2 border border-outline-variant rounded-lg font-label-md text-on-surface hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined text-[18px]" data-icon="hub">hub</span>
                    Uni Hub
                </button>
</div>
</div>
<!-- Footer / Redirect -->
<p class="mt-stack-lg text-center font-body-md text-on-surface-variant">
            Don't have an account? 
            <a class="text-primary font-label-md hover:underline decoration-2 underline-offset-4" href="#">Sign Up</a>
</p>
<!-- Academic Trust Badge -->
<div class="mt-stack-lg pt-stack-md border-t border-surface-variant/30 flex items-center justify-center gap-4 grayscale opacity-60">
<div class="flex items-center gap-1">
<span class="material-symbols-outlined text-[16px]" data-icon="verified_user">verified_user</span>
<span class="text-[10px] font-bold tracking-widest uppercase">Secured by SCU</span>
</div>
<div class="flex items-center gap-1">
<span class="material-symbols-outlined text-[16px]" data-icon="shield">shield</span>
<span class="text-[10px] font-bold tracking-widest uppercase">Student Verified</span>
</div>
</div>
</div>
<!-- Background Decorative Element (Asymmetric/Glassmorphism feel) -->
<div class="fixed top-[-10%] right-[-5%] w-[400px] h-[400px] bg-primary/5 rounded-full blur-[100px] -z-10"></div>
<div class="fixed bottom-[-10%] left-[-5%] w-[300px] h-[300px] bg-secondary/5 rounded-full blur-[80px] -z-10"></div>
</body></html>
