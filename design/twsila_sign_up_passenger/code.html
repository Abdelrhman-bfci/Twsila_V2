<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "inverse-on-surface": "#ebf1ff",
                    "inverse-primary": "#c3c0ff",
                    "tertiary-fixed-dim": "#ffb95f",
                    "inverse-surface": "#2a313d",
                    "secondary": "#006c4a",
                    "background": "#f9f9ff",
                    "error-container": "#ffdad6",
                    "on-tertiary-fixed-variant": "#653e00",
                    "on-tertiary": "#ffffff",
                    "on-primary": "#ffffff",
                    "surface-dim": "#d3daea",
                    "surface-container": "#e7eefe",
                    "secondary-fixed-dim": "#68dba9",
                    "surface-container-lowest": "#ffffff",
                    "primary-container": "#3730a3",
                    "outline-variant": "#c8c4d5",
                    "primary-fixed": "#e2dfff",
                    "tertiary-container": "#603b00",
                    "on-secondary-fixed": "#002114",
                    "on-tertiary-fixed": "#2a1700",
                    "surface-tint": "#544fc0",
                    "primary-fixed-dim": "#c3c0ff",
                    "secondary-fixed": "#85f8c4",
                    "on-background": "#151c27",
                    "surface": "#f9f9ff",
                    "secondary-container": "#82f5c1",
                    "on-primary-fixed-variant": "#3b35a7",
                    "surface-variant": "#dce2f3",
                    "surface-bright": "#f9f9ff",
                    "on-error": "#ffffff",
                    "on-secondary": "#ffffff",
                    "on-secondary-container": "#00714e",
                    "on-tertiary-container": "#f49d09",
                    "error": "#ba1a1a",
                    "tertiary": "#422700",
                    "on-secondary-fixed-variant": "#005137",
                    "surface-container-highest": "#dce2f3",
                    "outline": "#777584",
                    "on-surface-variant": "#464553",
                    "on-primary-container": "#a9a7ff",
                    "on-primary-fixed": "#0f0069",
                    "on-error-container": "#93000a",
                    "tertiary-fixed": "#ffddb8",
                    "surface-container-low": "#f0f3ff",
                    "on-surface": "#151c27",
                    "primary": "#1f108e",
                    "surface-container-high": "#e2e8f8"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "container-margin": "24px",
                    "gutter": "16px",
                    "stack-md": "16px",
                    "stack-lg": "32px",
                    "stack-sm": "8px",
                    "unit": "8px"
            },
            "fontFamily": {
                    "h3": ["Cairo"],
                    "h2": ["Cairo"],
                    "label-sm": ["Cairo"],
                    "h1": ["Cairo"],
                    "body-md": ["Cairo"],
                    "label-md": ["Cairo"],
                    "body-lg": ["Cairo"]
            },
            "fontSize": {
                    "h3": ["20px", {"lineHeight": "1.4", "fontWeight": "600"}],
                    "h2": ["24px", {"lineHeight": "1.3", "fontWeight": "700"}],
                    "label-sm": ["12px", {"lineHeight": "1.2", "fontWeight": "500"}],
                    "h1": ["32px", {"lineHeight": "1.2", "fontWeight": "700"}],
                    "body-md": ["16px", {"lineHeight": "1.5", "fontWeight": "400"}],
                    "label-md": ["14px", {"lineHeight": "1.2", "letterSpacing": "0.02em", "fontWeight": "600"}],
                    "body-lg": ["18px", {"lineHeight": "1.6", "fontWeight": "400"}]
            }
          },
        },
      }
    </script>
<style>
        body { font-family: 'Cairo', sans-serif; background-color: #f9f9ff; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-effect {
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-surface text-on-surface antialiased min-h-screen flex flex-col">
<!-- Hero / Header Section -->
<header class="relative h-[240px] w-full overflow-hidden">
<div class="absolute inset-0 bg-primary-container z-0">
<img alt="University students walking on a modern campus" class="w-full h-full object-cover opacity-30" data-alt="high-quality wide shot of diverse university students walking across a sunny modern campus with indigo architectural accents and lush greenery" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCPiPi9ut0n4wHzymVUUi-KXvJfcSdKy7eGqk4RbIf6MD6jB48WSVhn46XUs4rmBTco1fzVbXAc_yJDQIkzazVGIat5KZMoSUB2R8XgJxsS2vBJ2FOZpgBU4iQCCA-9lvh8S0egpkGjSDwTw1dlN-CVncz4b1CTX5SWtfTml6gmzew6ZkgWA2CTcmpg0SXZu2Dp8xczboxA_TDFH_yWHyBor4KRDMcQN6J96XuKUrkjzHRPhyQMXAi7dpUQlnAS-9xn_26-qHWCiMQ"/>
<div class="absolute inset-0 bg-gradient-to-b from-primary-container/60 to-surface"></div>
</div>
<div class="relative z-10 px-container-margin pt-stack-lg">
<div class="flex items-center justify-between mb-stack-md">
<button class="w-10 h-10 rounded-full bg-white/20 flex items-center justify-center text-white glass-effect">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
</div>
<h1 class="font-h1 text-h1 text-on-primary-container">Join TWSILA</h1>
<p class="font-body-md text-body-md text-on-primary-container/80 max-w-[280px]">Your reliable peer for university commuting and academic excellence.</p>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow px-container-margin -mt-12 relative z-20 pb-stack-lg">
<div class="bg-surface-container-lowest rounded-xl p-6 shadow-[0_12px_40px_rgba(55,48,163,0.08)] border border-outline-variant/30">
<form action="#" class="flex flex-col gap-gutter">
<!-- Role Selection -->
<div class="mb-2">
<label class="font-label-md text-label-md text-on-surface-variant mb-3 block uppercase tracking-wider">Choose your role</label>
<div class="grid grid-cols-2 gap-stack-md p-1 bg-surface-container-high rounded-lg">
<button class="flex items-center justify-center gap-2 py-3 px-4 rounded-md bg-white text-primary shadow-sm font-label-md border border-outline-variant/10" type="button"><span class="material-symbols-outlined" data-icon="school" style="font-variation-settings: 'FILL' 1;">school</span> Passenger</button>
<button class="flex items-center justify-center gap-2 py-3 px-4 rounded-md text-on-surface-variant font-label-md hover:bg-white/50 transition-all" type="button">
<span class="material-symbols-outlined" data-icon="directions_car">directions_car</span>
                            Captain
                        </button>
</div>
</div>
<!-- Input Fields Grid (Asymmetric layout feel) -->
<div class="space-y-stack-md">
<!-- Full Name -->
<div class="space-y-1">
<label class="font-label-md text-label-md text-on-surface-variant px-1" for="name">Full Name</label>
<div class="relative group">
<span class="absolute left-4 top-1/2 -translate-y-1/2 material-symbols-outlined text-outline group-focus-within:text-primary" data-icon="person">person</span>
<input class="w-full pl-12 pr-4 py-3.5 bg-surface border-outline-variant rounded-lg focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all font-body-md" id="name" placeholder="Enter your full name" type="text"/>
</div>
</div>
<!-- University Email -->
<div class="space-y-1">
<label class="font-label-md text-label-md text-on-surface-variant px-1" for="email">University Email</label>
<div class="relative group">
<span class="absolute left-4 top-1/2 -translate-y-1/2 material-symbols-outlined text-outline group-focus-within:text-primary" data-icon="alternate_email">alternate_email</span>
<input class="w-full pl-12 pr-4 py-3.5 bg-surface border-outline-variant rounded-lg focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all font-body-md" id="email" placeholder="passenger@university.edu" type="email"/>
</div>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-gutter">
<!-- ID Number -->
<div class="space-y-1">
<label class="font-label-md text-label-md text-on-surface-variant px-1" for="id_number">ID Number</label>
<div class="relative group">
<span class="absolute left-4 top-1/2 -translate-y-1/2 material-symbols-outlined text-outline group-focus-within:text-primary" data-icon="badge">badge</span>
<input class="w-full pl-12 pr-4 py-3.5 bg-surface border-outline-variant rounded-lg focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all font-body-md" id="id_number" placeholder="University ID" type="text"/>
</div>
</div>
<!-- Mobile Number -->
<div class="space-y-1">
<label class="font-label-md text-label-md text-on-surface-variant px-1" for="mobile">Mobile Number</label>
<div class="relative group">
<span class="absolute left-4 top-1/2 -translate-y-1/2 material-symbols-outlined text-outline group-focus-within:text-primary" data-icon="smartphone">smartphone</span>
<input class="w-full pl-12 pr-4 py-3.5 bg-surface border-outline-variant rounded-lg focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all font-body-md" id="mobile" placeholder="+20 1XX XXX XXXX" type="tel"/>
</div>
</div>
</div>
<!-- Password -->
<div class="space-y-1">
<label class="font-label-md text-label-md text-on-surface-variant px-1" for="password">Password</label>
<div class="relative group">
<span class="absolute left-4 top-1/2 -translate-y-1/2 material-symbols-outlined text-outline group-focus-within:text-primary" data-icon="lock">lock</span>
<input class="w-full pl-12 pr-12 py-3.5 bg-surface border-outline-variant rounded-lg focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all font-body-md" id="password" placeholder="Min. 8 characters" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline" type="button">
<span class="material-symbols-outlined" data-icon="visibility">visibility</span>
</button>
</div>
</div>
</div>
<!-- Terms and Conditions -->
<div class="flex items-start gap-3 mt-2">
<div class="flex items-center h-5">
<input class="w-5 h-5 text-primary border-outline-variant rounded focus:ring-primary focus:ring-offset-0" id="terms" type="checkbox"/>
</div>
<label class="font-label-sm text-label-sm text-on-surface-variant" for="terms">
                        I agree to the <a class="text-primary font-bold hover:underline" href="#">Terms of Service</a> and <a class="text-primary font-bold hover:underline" href="#">Privacy Policy</a> of TWSILA Community.
                    </label>
</div>
<!-- Action Button -->
<button class="w-full mt-4 bg-primary text-on-primary py-4 rounded-xl font-label-md flex items-center justify-center gap-2 shadow-[0_8px_16px_rgba(31,16,142,0.2)] active:scale-[0.98] transition-transform duration-150" type="submit">
                    Create Account
                    <span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<!-- Footer / Sign In link -->
<div class="mt-8 text-center">
<p class="font-body-md text-on-surface-variant">
                    Already a member? 
                    <a class="text-primary font-bold" href="#">Sign In here</a>
</p>
</div>
</div>
<!-- Academic Trust Badge -->
<div class="mt-stack-lg flex items-center justify-center gap-4 py-6 px-4 border border-secondary/10 bg-secondary-container/10 rounded-2xl">
<div class="w-12 h-12 bg-secondary-container flex items-center justify-center rounded-full text-on-secondary-container">
<span class="material-symbols-outlined" data-icon="verified_user" style="font-variation-settings: 'FILL' 1;">verified_user</span>
</div>
<div>
<h4 class="font-label-md text-on-secondary-container">University Verified Commute</h4>
<p class="text-[12px] text-on-secondary-fixed-variant leading-tight">Your safety and academic punctuality are our top priorities.</p>
</div>
</div>
</main>
<!-- Bottom spacing for focus -->
<footer class="mt-auto h-12"></footer>
</body></html>
